<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>登录/注册 - 智选商城</title>
	<style>
		*{margin:0;padding:0;box-sizing:border-box}
		body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f4f5;color:#333;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}

		/* 顶部导航 */
		.topbar{background:#fff;border-bottom:1px solid #eee;padding:16px 24px;display:flex;align-items:center}
		.topbar .logo{font-size:24px;font-weight:700;color:#e60012;text-decoration:none}
		.topbar .logo small{font-size:12px;color:#999;font-weight:400;margin-left:4px}
		.topbar .back{font-size:13px;color:#999;text-decoration:none;display:flex;align-items:center;gap:4px;transition:color .2s}
		.topbar .back:hover{color:#e60012}
		.topbar-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;width:100%}

		/* 主内容 */
		.main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px}
		.auth-card{background:#fff;border-radius:12px;width:420px;max-width:100%;box-shadow:0 4px 24px rgba(0,0,0,.06);overflow:hidden}

		/* Tab */
		.auth-tabs{display:flex;border-bottom:1px solid #eee}
		.auth-tab{flex:1;text-align:center;padding:16px;font-size:15px;color:#999;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none}
		.auth-tab.active{color:#e60012;border-bottom-color:#e60012;font-weight:600}
		.auth-tab:hover{color:#e60012}

		/* 表单 */
		.auth-form{padding:32px 36px}
		.auth-form.hidden{display:none}
		.form-group{margin-bottom:20px}
		.form-group label{display:block;font-size:13px;color:#666;margin-bottom:6px;font-weight:500}
		.form-group input{width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:6px;font-size:14px;outline:none;transition:border-color .2s}
		.form-group input:focus{border-color:#e60012}
		.form-group input.error{border-color:#e60012;background:#fff5f5}
		.form-error{font-size:11px;color:#e60012;margin-top:4px;display:none}
		.form-error.show{display:block}
		.form-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
		.form-check{display:flex;align-items:center;gap:6px;font-size:13px;color:#999;cursor:pointer}
		.form-check input{accent-color:#e60012}
		.forgot{font-size:13px;color:#e60012;text-decoration:none}
		.forgot:hover{text-decoration:underline}
		.btn-primary{width:100%;padding:12px;background:#e60012;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer;transition:background .2s;font-weight:500}
		.btn-primary:hover{background:#c40010}
		.btn-primary:disabled{background:#ccc;cursor:not-allowed}

		/* 第三方 */
		.auth-divider{display:flex;align-items:center;margin:20px 0;color:#ccc;font-size:12px}
		.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:#eee}
		.auth-divider span{margin:0 12px}
		.social-login{display:flex;justify-content:center;gap:20px}
		.social-btn{width:44px;height:44px;border-radius:50%;border:1px solid #eee;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:20px}
		.social-btn:hover{border-color:#e60012;box-shadow:0 2px 8px rgba(230,0,18,.1)}
		.auth-tip{text-align:center;font-size:12px;color:#ccc;margin-top:16px}

		/* Toast */
		.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-10px);background:#333;color:#fff;padding:12px 24px;border-radius:6px;font-size:14px;z-index:1000;opacity:0;transition:all .3s;pointer-events:none}
		.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
		.toast.success{background:#52c41a}
		.toast.error{background:#e60012}
	</style>
</head>
<body>

<!-- 顶部 -->
<div class="topbar">
	<div class="topbar-inner">
		<a href="index.html" class="back">&#8592; 返回首页</a>
		<a href="index.html" class="logo">智选商城<small>AI虚拟商品</small></a>
		<div></div>
	</div>
</div>

<!-- 主体 -->
<div class="main">
	<div class="auth-card">
		<div class="auth-tabs">
			<button class="auth-tab active" data-tab="login" onclick="switchTab('login')">登录</button>
			<button class="auth-tab" data-tab="register" onclick="switchTab('register')">注册</button>
		</div>

		<!-- 登录表单 -->
		<form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
			<div class="form-group">
				<label>用户名 / 邮箱</label>
				<input type="text" id="loginUser" placeholder="请输入用户名或邮箱" required />
				<div class="form-error" id="loginUserError"></div>
			</div>
			<div class="form-group">
				<label>密码</label>
				<input type="password" id="loginPass" placeholder="请输入密码" required />
				<div class="form-error" id="loginPassError"></div>
			</div>
			<div class="form-row">
				<label class="form-check">
					<input type="checkbox" id="remember" /> 记住我
				</label>
				<a href="javascript:void(0)" class="forgot" onclick="toast('请联系客服找回密码','error')">忘记密码？</a>
			</div>
			<button type="submit" class="btn-primary">登 录</button>
		</form>

		<!-- 注册表单 -->
		<form class="auth-form hidden" id="registerForm" onsubmit="handleRegister(event)">
			<div class="form-group">
				<label>用户名</label>
				<input type="text" id="regUser" placeholder="4-16位字母或数字" required />
				<div class="form-error" id="regUserError"></div>
			</div>
			<div class="form-group">
				<label>邮箱</label>
				<input type="email" id="regEmail" placeholder="请输入邮箱地址" required />
				<div class="form-error" id="regEmailError"></div>
			</div>
			<div class="form-group">
				<label>密码</label>
				<input type="password" id="regPass" placeholder="至少6位密码" required />
				<div class="form-error" id="regPassError"></div>
			</div>
			<div class="form-group">
				<label>确认密码</label>
				<input type="password" id="regPass2" placeholder="请再次输入密码" required />
				<div class="form-error" id="regPass2Error"></div>
			</div>
			<div class="form-row">
				<label class="form-check">
					<input type="checkbox" id="agree" required /> 同意 <a href="javascript:void(0)" style="color:#e60012">用户协议</a> 和 <a href="javascript:void(0)" style="color:#e60012">隐私政策</a>
				</label>
			</div>
			<button type="submit" class="btn-primary">注 册</button>
		</form>

		<div style="padding:0 36px 32px">
			<div class="auth-divider"><span>社交账号登录</span></div>
			<div class="social-login">
				<button class="social-btn" title="微信" onclick="toast('微信登录即将上线')">💬</button>
				<button class="social-btn" title="QQ" onclick="toast('QQ登录即将上线')">🐧</button>
				<button class="social-btn" title="GitHub" onclick="toast('GitHub登录即将上线')">🐙</button>
			</div>
		</div>
	</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
	// ===== Tab 切换 =====
	function switchTab(tab) {
		document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
		document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
		document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
		document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
		clearErrors();
	}

	function clearErrors() {
		document.querySelectorAll('.form-error').forEach(e => e.classList.remove('show'));
		document.querySelectorAll('input.error').forEach(e => e.classList.remove('error'));
	}

	// ===== Toast =====
	function toast(msg, type) {
		const t = document.getElementById('toast');
		t.textContent = msg;
		t.className = 'toast';
		if (type) t.classList.add(type);
		t.classList.add('show');
		clearTimeout(t._timer);
		t._timer = setTimeout(() => t.classList.remove('show'), 3000);
	}

	// ===== 登录 =====
	function handleLogin(e) {
		e.preventDefault();
		clearErrors();
		const user = document.getElementById('loginUser').value.trim();
		const pass = document.getElementById('loginPass').value.trim();
		let valid = true;

		if (!user) { showError('loginUser','loginUserError','请输入用户名'); valid = false; }
		if (!pass) { showError('loginPass','loginPassError','请输入密码'); valid = false; }
		if (pass && pass.length < 4) { showError('loginPass','loginPassError','密码至少4位'); valid = false; }

		if (!valid) return;

		// 模拟验证
		const users = JSON.parse(localStorage.getItem('shopUsers') || '{}');
		const pwd = users[user];
		if (!pwd) {
			showError('loginUser', 'loginUserError', '用户不存在，请先注册');
			return;
		}
		if (pwd !== pass) {
			showError('loginPass', 'loginPassError', '密码错误');
			return;
		}

		// 登录成功
		localStorage.setItem('currentUser', JSON.stringify({ username: user, loginTime: Date.now() }));
		if (document.getElementById('remember').checked) {
			localStorage.setItem('rememberedUser', user);
		} else {
			localStorage.removeItem('rememberedUser');
		}
		toast('登录成功！正在跳转...', 'success');
		setTimeout(() => {
			const redirect = new URLSearchParams(location.search).get('redirect') || 'index.html';
			location.href = redirect;
		}, 800);
	}

	// ===== 注册 =====
	function handleRegister(e) {
		e.preventDefault();
		clearErrors();
		const user = document.getElementById('regUser').value.trim();
		const email = document.getElementById('regEmail').value.trim();
		const pass = document.getElementById('regPass').value.trim();
		const pass2 = document.getElementById('regPass2').value.trim();
		let valid = true;

		if (!user) { showError('regUser','regUserError','请输入用户名'); valid = false; }
		else if (!/^[a-zA-Z0-9_\u4e00-\u9fa5]{4,16}$/.test(user)) {
			showError('regUser','regUserError','用户名需4-16位字母/数字/中文'); valid = false;
		}
		if (!email) { showError('regEmail','regEmailError','请输入邮箱'); valid = false; }
		else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
			showError('regEmail','regEmailError','邮箱格式不正确'); valid = false;
		}
		if (!pass) { showError('regPass','regPassError','请输入密码'); valid = false; }
		else if (pass.length < 6) { showError('regPass','regPassError','密码至少6位'); valid = false; }
		if (!pass2) { showError('regPass2','regPass2Error','请确认密码'); valid = false; }
		else if (pass !== pass2) { showError('regPass2','regPass2Error','两次密码不一致'); valid = false; }

		if (!document.getElementById('agree').checked) {
			toast('请先同意用户协议和隐私政策', 'error'); valid = false;
		}
		if (!valid) return;

		// 检查用户名是否已被注册
		const users = JSON.parse(localStorage.getItem('shopUsers') || '{}');
		if (users[user]) {
			showError('regUser', 'regUserError', '该用户名已被注册');
			return;
		}
		users[user] = pass;
		localStorage.setItem('shopUsers', JSON.stringify(users));
		localStorage.setItem('currentUser', JSON.stringify({ username: user, email: email, loginTime: Date.now() }));
		toast('注册成功！正在跳转...', 'success');
		setTimeout(() => {
			const redirect = new URLSearchParams(location.search).get('redirect') || 'index.html';
			location.href = redirect;
		}, 800);
	}

	function showError(inputId, errorId, msg) {
		document.getElementById(inputId).classList.add('error');
		const err = document.getElementById(errorId);
		err.textContent = msg;
		err.classList.add('show');
	}

	// ===== 自动填充记住的用户名 =====
	const remembered = localStorage.getItem('rememberedUser');
	if (remembered) {
		document.getElementById('loginUser').value = remembered;
		document.getElementById('remember').checked = true;
	}
</script>
<script src="ai-assistant.js"></script>
</body>
</html>
