<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>我的订单 - 智选商城</title>
	<style>
		*{margin:0;padding:0;box-sizing:border-box}
		body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f4f5;color:#333;line-height:1.6}

		/* 导航 */
		.navbar{background:#fff;border-bottom:1px solid #eee}
		.navbar-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;padding:16px 24px;justify-content:space-between}
		.logo{font-size:24px;font-weight:700;color:#e60012;text-decoration:none}
		.logo small{font-size:12px;color:#999;font-weight:400;margin-left:4px}
		.nav-user{display:flex;align-items:center;gap:16px}
		.nav-user span{font-size:13px;color:#666}
		.nav-user a{font-size:13px;color:#999;text-decoration:none}
		.nav-user a:hover{color:#e60012}

		/* 主体 */
		.main{max-width:1200px;margin:32px auto;padding:0 24px}

		/* 用户信息卡片 */
		.user-card{background:linear-gradient(135deg,#e60012,#ff4d4f);border-radius:12px;padding:28px 32px;margin-bottom:24px;color:#fff}
		.user-card h2{font-size:22px;font-weight:700;margin-bottom:4px}
		.user-card p{font-size:13px;opacity:.85}
		.user-card .stats{display:flex;gap:32px;margin-top:16px}
		.user-card .stat{text-align:center}
		.user-card .stat .num{font-size:24px;font-weight:700}
		.user-card .stat .label{font-size:11px;opacity:.8;margin-top:2px}

		/* 筛选栏 */
		.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
		.filter-btn{padding:8px 20px;background:#fff;border:1px solid #eee;border-radius:20px;font-size:13px;color:#666;cursor:pointer;transition:all .2s}
		.filter-btn:hover{border-color:#e60012;color:#e60012}
		.filter-btn.active{background:#e60012;color:#fff;border-color:#e60012}

		/* 订单列表 */
		.order-card{background:#fff;border-radius:12px;border:1px solid #eee;margin-bottom:16px;overflow:hidden;transition:box-shadow .2s}
		.order-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.04)}
		.order-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#fafafa;border-bottom:1px solid #f5f5f5}
		.order-header .order-id{font-size:13px;color:#999}
		.order-header .order-id strong{color:#333;margin-right:12px}
		.order-header .order-date{font-size:12px;color:#ccc}
		.order-status{font-size:12px;padding:3px 12px;border-radius:12px;font-weight:500}
		.status-paid{background:#e6f7ff;color:#1890ff}
		.status-shipped{background:#fff7e6;color:#fa8c16}
		.status-done{background:#f6ffed;color:#52c41a}
		.status-cancel{background:#fff2f0;color:#e60012}

		.order-body{padding:16px 20px}
		.order-items{margin-bottom:12px}
		.order-items .item{display:flex;align-items:center;gap:12px;padding:8px 0}
		.order-items .item img{width:48px;height:48px;border-radius:6px;object-fit:cover;background:#fafafa}
		.order-items .item-info{flex:1;min-width:0}
		.order-items .item-info h4{font-size:13px;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
		.order-items .item-info .spec{font-size:11px;color:#999;margin-top:2px}
		.order-items .item-price{font-size:13px;color:#e60012;font-weight:500;text-align:right;min-width:80px}

		.order-footer{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-top:1px solid #f5f5f5}
		.order-footer .total{font-size:14px;color:#666}
		.order-footer .total strong{font-size:18px;color:#e60012;margin-left:8px}
		.order-actions{display:flex;gap:8px}
		.btn-sm{padding:6px 16px;border-radius:4px;font-size:12px;cursor:pointer;transition:all .2s;text-decoration:none}
		.btn-primary-sm{background:#e60012;color:#fff;border:none}
		.btn-primary-sm:hover{background:#c40010}
		.btn-outline-sm{background:#fff;color:#666;border:1px solid #ddd}
		.btn-outline-sm:hover{border-color:#e60012;color:#e60012}

		/* 空状态 */
		.empty-state{background:#fff;border-radius:12px;text-align:center;padding:80px 20px;border:1px solid #eee}
		.empty-state svg{width:80px;height:80px;stroke:#ddd;margin-bottom:16px}
		.empty-state h3{font-size:18px;color:#999;margin-bottom:8px}
		.empty-state p{font-size:14px;color:#ccc;margin-bottom:20px}
		.empty-state a{display:inline-block;background:#e60012;color:#fff;padding:10px 32px;border-radius:6px;text-decoration:none;font-size:14px;font-weight:500}
		.empty-state a:hover{background:#c40010}

		/* Toast */
		.toast{position:fixed;top:80px;right:24px;background:#333;color:#fff;padding:12px 20px;border-radius:4px;font-size:14px;z-index:1000;opacity:0;transform:translateY(-10px);transition:all .3s;pointer-events:none}
		.toast.show{opacity:1;transform:translateY(0)}
		.toast.success{background:#52c41a}

		/* 需要登录 */
		.login-required{background:#fff;border-radius:12px;text-align:center;padding:80px 20px;border:1px solid #eee}
		.login-required svg{width:64px;height:64px;stroke:#ddd;margin-bottom:16px}
		.login-required h3{font-size:18px;color:#999;margin-bottom:12px}
		.login-required a{display:inline-block;background:#e60012;color:#fff;padding:10px 32px;border-radius:6px;text-decoration:none;font-size:14px}
		.login-required a:hover{background:#c40010}

		@media(max-width:768px){
			.order-header{flex-direction:column;align-items:flex-start;gap:8px}
			.user-card .stats{gap:16px}
		}
	</style>
</head>
<body>

<nav class="navbar">
	<div class="navbar-inner">
		<a href="index.html" class="logo">智选商城<small>AI虚拟商品</small></a>
		<div class="nav-user">
			<span id="navUsername">未登录</span>
			<a href="index.html">返回首页</a>
			<a href="login.html?redirect=orders.html" id="navLogin">登录</a>
			<a href="javascript:void(0)" id="navLogout" style="display:none" onclick="logout()">退出</a>
		</div>
	</div>
</nav>

<div class="main">
	<!-- 未登录 -->
	<div class="login-required hidden" id="loginRequired">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
		<h3>请先登录查看订单</h3>
		<a href="login.html?redirect=orders.html">立即登录</a>
	</div>

	<!-- 已登录 -->
	<div id="orderContent" class="hidden">
		<!-- 用户卡片 -->
		<div class="user-card">
			<h2 id="welcomeName">欢迎回来</h2>
			<p>这里汇总了您的所有订单信息</p>
			<div class="stats">
				<div class="stat"><div class="num" id="statTotal">0</div><div class="label">全部订单</div></div>
				<div class="stat"><div class="num" id="statPaid">0</div><div class="label">已支付</div></div>
				<div class="stat"><div class="num" id="statDone">0</div><div class="label">已完成</div></div>
				<div class="stat"><div class="num" id="statSpent">0</div><div class="label">累计消费(&yen;)</div></div>
			</div>
		</div>

		<!-- 筛选 -->
		<div class="filter-bar">
			<button class="filter-btn active" data-status="all" onclick="filterOrders('all',this)">全部</button>
			<button class="filter-btn" data-status="paid" onclick="filterOrders('paid',this)">已支付</button>
			<button class="filter-btn" data-status="shipped" onclick="filterOrders('shipped',this)">已发货</button>
			<button class="filter-btn" data-status="done" onclick="filterOrders('done',this)">已完成</button>
			<button class="filter-btn" data-status="cancel" onclick="filterOrders('cancel',this)">已取消</button>
		</div>

		<!-- 订单列表 -->
		<div id="orderList"></div>

		<!-- 空状态 -->
		<div class="empty-state hidden" id="emptyState">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
			<h3>暂无订单</h3>
			<p>快去选购喜欢的商品吧</p>
			<a href="index.html">去购物</a>
		</div>
	</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
	const user = JSON.parse(localStorage.getItem('currentUser'));
	const orders = JSON.parse(localStorage.getItem('shopOrders') || '[]');

	if (!user) {
		document.getElementById('loginRequired').classList.remove('hidden');
		document.getElementById('orderContent').classList.add('hidden');
	} else {
		document.getElementById('loginRequired').classList.add('hidden');
		document.getElementById('orderContent').classList.remove('hidden');
		document.getElementById('navUsername').textContent = user.username;
		document.getElementById('navLogin').style.display = 'none';
		document.getElementById('navLogout').style.display = 'inline';
		document.getElementById('welcomeName').textContent = user.username + '，欢迎回来！';

		updateStats();
		filterOrders('all', document.querySelector('.filter-btn.active'));
	}

	function updateStats() {
		const allOrders = orders;
		const paid = allOrders.filter(o => o.status === 'paid').length;
		const done = allOrders.filter(o => o.status === 'done').length;
		const totalSpent = allOrders.reduce((s, o) => s + o.total, 0);
		document.getElementById('statTotal').textContent = allOrders.length;
		document.getElementById('statPaid').textContent = paid;
		document.getElementById('statDone').textContent = done;
		document.getElementById('statSpent').textContent = totalSpent.toFixed(0);
	}

	function filterOrders(status, btn) {
		document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
		btn.classList.add('active');

		const filtered = status === 'all' ? orders : orders.filter(o => o.status === status);

		if (filtered.length === 0) {
			document.getElementById('orderList').innerHTML = '';
			document.getElementById('emptyState').classList.remove('hidden');
		} else {
			document.getElementById('emptyState').classList.add('hidden');
			renderOrders(filtered);
		}
	}

	function renderOrders(list) {
		const statusMap = { paid: 'status-paid', shipped: 'status-shipped', done: 'status-done', cancel: 'status-cancel' };
		document.getElementById('orderList').innerHTML = list.map(o => `
			<div class="order-card">
				<div class="order-header">
					<div>
						<span class="order-id"><strong>订单号:</strong> ${o.id}</span>
						<span class="order-date">${o.date}</span>
					</div>
					<span class="order-status ${statusMap[o.status] || ''}">${o.statusLabel || o.status}</span>
				</div>
				<div class="order-body">
					<div class="order-items">
						${o.items.map(i => `
						<div class="item">
							<img src="${i.img}" alt="${i.name}" onerror="this.style.display='none'"/>
							<div class="item-info">
								<h4>${i.name}</h4>
								<div class="spec">&yen;${i.price} × ${i.qty}</div>
							</div>
							<div class="item-price">&yen;${(i.price * i.qty).toFixed(1)}</div>
						</div>`).join('')}
					</div>
				</div>
				<div class="order-footer">
					<div class="total">
						<span>${o.payMethod || ''} · 共 ${o.items.length} 件</span>
						<strong>&yen;${o.total.toFixed(1)}</strong>
					</div>
					<div class="order-actions">
						${o.status === 'paid' ? '<button class="btn-sm btn-primary-sm" onclick="simulateShip(\''+o.id+'\')">模拟发货</button>' : ''}
						${o.status === 'shipped' ? '<button class="btn-sm btn-primary-sm" onclick="confirmReceived(\''+o.id+'\')">确认收货</button>' : ''}
						${o.status === 'done' ? '<button class="btn-sm btn-outline-sm" onclick="toast(\'已评价\')">评价</button>' : ''}
						<button class="btn-sm btn-outline-sm" onclick="viewDetail('${o.id}')">查看详情</button>
					</div>
				</div>
			</div>
		`).join('');
	}

	// 模拟发货
	function simulateShip(id) {
		const order = orders.find(o => o.id === id);
		if (order) {
			order.status = 'shipped';
			order.statusLabel = '已发货';
			localStorage.setItem('shopOrders', JSON.stringify(orders));
			toast('订单 ' + id + ' 已发货', 'success');
			setTimeout(() => location.reload(), 500);
		}
	}

	// 确认收货
	function confirmReceived(id) {
		const order = orders.find(o => o.id === id);
		if (order) {
			order.status = 'done';
			order.statusLabel = '已完成';
			localStorage.setItem('shopOrders', JSON.stringify(orders));
			toast('已确认收货', 'success');
			setTimeout(() => location.reload(), 500);
		}
	}

	function viewDetail(id) {
		const order = orders.find(o => o.id === id);
		if (order) {
			toast(`订单 ${id} · 总额 ¥${order.total.toFixed(1)} · 状态: ${order.statusLabel} · 联系人: ${order.contact?.name || 'N/A'}`);
		}
	}

	function logout() {
		localStorage.removeItem('currentUser');
		location.href = 'index.html';
	}

	function toast(msg, type) {
		const t = document.getElementById('toast');
		t.textContent = msg;
		t.className = 'toast';
		if (type) t.classList.add(type);
		t.classList.add('show');
		clearTimeout(t._timer);
		t._timer = setTimeout(() => t.classList.remove('show'), 3000);
	}
</script>
</body>
</html>
