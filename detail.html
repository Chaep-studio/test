<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>商品详情 - 智选商城</title>
	<style>
		*{margin:0;padding:0;box-sizing:border-box}
		body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f4f5;color:#333;line-height:1.6}

		/* 导航 */
		.navbar{background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:100}
		.navbar-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;padding:16px 24px;gap:40px}
		.logo{font-size:24px;font-weight:700;color:#e60012;text-decoration:none}
		.logo small{font-size:12px;color:#999;font-weight:400;margin-left:4px}
		.search-box{flex:1;display:flex;align-items:center;border:2px solid #e60012;border-radius:4px;overflow:hidden;max-width:500px}
		.search-box input{flex:1;border:none;outline:none;padding:10px 14px;font-size:14px}
		.search-btn{background:#e60012;color:#fff;border:none;padding:10px 24px;font-size:14px;cursor:pointer}
		.nav-cart{position:relative;color:#666;cursor:pointer;width:28px;height:28px;text-decoration:none}
		.nav-cart svg{width:28px;height:28px}
		.nav-cart span{position:absolute;top:-4px;right:-8px;background:#e60012;color:#fff;font-size:10px;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center}

		/* 面包屑 */
		.breadcrumb{max-width:1200px;margin:0 auto;padding:16px 24px;font-size:12px;color:#999}
		.breadcrumb a{color:#999;text-decoration:none}
		.breadcrumb a:hover{color:#e60012}
		.breadcrumb span{color:#333}

		/* 详情主区域 */
		.detail-main{max-width:1200px;margin:0 auto;padding:0 24px 32px;display:grid;grid-template-columns:1fr 1fr;gap:32px}
		.detail-gallery{background:#fff;border-radius:12px;padding:24px;display:flex;align-items:center;justify-content:center;border:1px solid #eee;min-height:420px}
		.detail-gallery img{max-width:100%;max-height:400px;object-fit:contain;border-radius:8px}
		.detail-info{background:#fff;border-radius:12px;padding:32px;border:1px solid #eee}
		.detail-tag{display:inline-block;background:#fff0f0;color:#e60012;font-size:11px;padding:3px 10px;border-radius:3px;margin-bottom:12px}
		.detail-name{font-size:22px;font-weight:700;color:#333;margin-bottom:12px;line-height:1.4}
		.detail-desc{font-size:14px;color:#666;margin-bottom:20px;line-height:1.7}
		.detail-price-box{background:#fff5f5;border-radius:8px;padding:20px;margin-bottom:24px}
		.detail-price-row{display:flex;align-items:baseline;gap:8px}
		.detail-price{font-size:32px;color:#e60012;font-weight:700}
		.detail-price .unit{font-size:16px;font-weight:400}
		.detail-old{font-size:14px;color:#ccc;text-decoration:line-through;margin-left:8px}
		.detail-discount{display:inline-block;background:#e60012;color:#fff;font-size:11px;padding:2px 8px;border-radius:3px;margin-left:12px}
		.detail-meta{display:flex;gap:24px;font-size:13px;color:#999;margin-top:12px;padding-top:12px;border-top:1px dashed #f0d0d0}
		.detail-meta strong{color:#333}

		/* 购买区 */
		.detail-actions{display:flex;gap:12px;margin-bottom:16px}
		.qty-select{display:flex;align-items:center;border:1px solid #ddd;border-radius:6px;overflow:hidden}
		.qty-select button{width:36px;height:36px;border:none;background:#f5f5f5;font-size:18px;color:#666;cursor:pointer;transition:all .2s}
		.qty-select button:hover{background:#e60012;color:#fff}
		.qty-select button:disabled{color:#ccc;cursor:not-allowed;background:#f5f5f5}
		.qty-select input{width:48px;text-align:center;border:none;border-left:1px solid #ddd;border-right:1px solid #ddd;font-size:14px;outline:none}
		.btn-buy{flex:1;padding:12px 0;background:#e60012;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;transition:background .2s;font-weight:500}
		.btn-buy:hover{background:#c40010}
		.btn-cart-outline{flex:1;padding:12px 0;background:#fff;color:#e60012;border:1px solid #e60012;border-radius:6px;font-size:16px;cursor:pointer;transition:all .2s;font-weight:500}
		.btn-cart-outline:hover{background:#fff5f5}

		.detail-features{display:flex;gap:16px;flex-wrap:wrap}
		.detail-feature{display:flex;align-items:center;gap:6px;font-size:12px;color:#999}
		.detail-feature .dot{width:6px;height:6px;border-radius:50%;background:#e60012}

		/* 商品介绍 */
		.section{max-width:1200px;margin:0 auto 32px;padding:0 24px}
		.section-title{font-size:18px;font-weight:700;color:#333;margin-bottom:16px;padding-left:12px;border-left:3px solid #e60012}
		.detail-content{background:#fff;border-radius:12px;padding:32px;border:1px solid #eee}
		.detail-content h3{font-size:15px;color:#333;margin:20px 0 12px}
		.detail-content h3:first-child{margin-top:0}
		.detail-content p,.detail-content li{font-size:13px;color:#666;line-height:1.8;margin-bottom:6px}
		.detail-content ul{padding-left:20px}
		.spec-table{width:100%;border-collapse:collapse;margin:16px 0}
		.spec-table td{padding:8px 12px;font-size:13px;border-bottom:1px solid #f5f5f5}
		.spec-table td:first-child{color:#999;width:100px}

		/* 推荐商品 */
		.product-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
		.product-card{background:#fff;border:1px solid #f0f0f0;border-radius:8px;overflow:hidden;transition:all .2s;cursor:pointer;text-decoration:none;color:inherit}
		.product-card:hover{border-color:#ffccc7;box-shadow:0 4px 16px rgba(0,0,0,.08)}
		.product-img{height:160px;background:#fafafa;display:flex;align-items:center;justify-content:center;overflow:hidden}
		.product-img img{width:100%;height:100%;object-fit:cover}
		.product-info{padding:12px}
		.product-info h3{font-size:13px;color:#333;height:38px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.5}
		.product-price .num{font-size:18px;color:#e60012;font-weight:700}
		.product-price .old{font-size:11px;color:#ccc;text-decoration:line-through;margin-left:6px}

		/* Toast */
		.toast{position:fixed;top:80px;right:24px;background:#333;color:#fff;padding:12px 20px;border-radius:4px;font-size:14px;z-index:1000;opacity:0;transform:translateY(-10px);transition:all .3s;pointer-events:none}
		.toast.show{opacity:1;transform:translateY(0)}

		@media(max-width:768px){.detail-main{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(2,1fr)}}
	</style>
</head>
<body>

<!-- 导航 -->
<nav class="navbar">
	<div class="navbar-inner">
		<a href="index.html" class="logo">智选商城<small>AI虚拟商品</small></a>
		<div class="search-box">
			<input type="text" placeholder="搜索AI账号、提示词、工作流..." id="searchInput"/>
			<button class="search-btn" onclick="goSearch()">搜索</button>
		</div>
		<a href="index.html" class="nav-cart" title="购物车">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-8 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg>
			<span id="cartCount">0</span>

	</div>
</nav>

<!-- 面包屑 -->
<div class="breadcrumb">
	<a href="index.html">首页</a> &gt; <a href="index.html" id="breadcrumbCat">商品分类</a> &gt; <span id="breadcrumbName">商品详情</span>
</div>

<!-- 详情 -->
<div class="detail-main">
	<div class="detail-gallery">
		<img id="detailImg" src="" alt="商品图片" />
	</div>
	<div class="detail-info">
		<div class="detail-tag" id="detailTag"></div>
		<h1 class="detail-name" id="detailName"></h1>
		<p class="detail-desc" id="detailDesc"></p>
		<div class="detail-price-box">
			<div class="detail-price-row">
				<span class="detail-price"><span class="unit">&yen;</span><span id="detailPrice"></span></span>
				<span class="detail-old" id="detailOld"></span>
				<span class="detail-discount" id="detailDiscount"></span>
			</div>
			<div class="detail-meta">
				<span>已售 <strong id="detailSold"></strong>+</span>
				<span>库存 <strong>充足</strong></span>
				<span>发货 <strong>自动秒发</strong></span>
			</div>
		</div>
		<div class="detail-actions">
			<div class="qty-select">
				<button onclick="changeQty(-1)" id="qtyMinus">−</button>
				<input type="text" id="buyQty" value="1" onchange="validateQty()" />
				<button onclick="changeQty(1)" id="qtyPlus">+</button>
			</div>
		</div>
		<div class="detail-actions">
			<button class="btn-buy" onclick="buyNow()">立即购买</button>
			<button class="btn-cart-outline" onclick="addToCartDetail()">加入购物车</button>
		</div>
		<div class="detail-features">
			<div class="detail-feature"><span class="dot"></span>自动发货</div>
			<div class="detail-feature"><span class="dot"></span>正品保障</div>
			<div class="detail-feature"><span class="dot"></span>售后无忧</div>
			<div class="detail-feature"><span class="dot"></span>即买即用</div>
		</div>
	</div>
</div>

<!-- 商品介绍 -->
<div class="section">
	<h2 class="section-title">商品详情</h2>
	<div class="detail-content" id="detailLongDesc">
		<!-- JS 动态填充 -->
	</div>
</div>

<!-- 推荐商品 -->
<div class="section" id="relatedSection">
	<h2 class="section-title">相关推荐</h2>
	<div class="product-grid" id="relatedGrid"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

		{ id:4, name:'AI 写作提示词合集', desc:'200+ 精选写作提示词', price:19.9, oldPrice:39, tag:'prompt', tagLabel:'提示词', img:'img/xiezuo.jpg.jpeg', sold:3200,

		{ id:5, name:'AI 绘画大师提示词', desc:'Midjourney/SD 出图提示词', price:29.9, oldPrice:59, tag:'prompt', tagLabel:'提示词', img:'img/2.jpg.jpg', sold:2100,

	let currentProduct = null;
	let buyQty = 1;

	// 初始化：从 URL 获取商品 ID
	const params = new URLSearchParams(location.search);
	const productId = parseInt(params.get('id')) || 1;
	currentProduct = products.find(p => p.id === productId) || products[0];

	// 渲染详情
	document.getElementById('detailImg').src = currentProduct.img;
	document.getElementById('detailImg').alt = currentProduct.name;
	document.getElementById('detailTag').textContent = currentProduct.tagLabel;
	document.getElementById('detailName').textContent = currentProduct.name;
	document.getElementById('detailDesc').textContent = currentProduct.desc;
	document.getElementById('detailPrice').textContent = currentProduct.price;
	document.getElementById('detailOld').textContent = '\u00a5' + currentProduct.oldPrice;
	document.getElementById('detailSold').textContent = currentProduct.sold;
	const discount = Math.round((1 - currentProduct.price / currentProduct.oldPrice) * 100);
	document.getElementById('detailDiscount').textContent = '-' + discount + '%';

	// 面包屑
	const catMap = {account:'AI 账号',prompt:'AI 提示词',workflow:'AI 工作流',tool:'AI 工具'};
	document.getElementById('breadcrumbCat').textContent = catMap[currentProduct.tag] || '商品分类';
	document.getElementById('breadcrumbName').textContent = currentProduct.name;
	document.title = currentProduct.name + ' - 智选商城';

	// 商品详情内容
	document.getElementById('detailLongDesc').innerHTML = currentProduct.longDesc || currentProduct.desc;

	// 相关推荐（同类其他商品）
	const related = products.filter(p => p.tag === currentProduct.tag && p.id !== currentProduct.id);
	if (related.length > 0) {
		document.getElementById('relatedGrid').innerHTML = related.map(p => `
			<a href="detail.html?id=${p.id}" class="product-card">
				<div class="product-img"><img src="${p.img}" alt="${p.name}"/></div>
				<div class="product-info">

					<div class="product-price">
						<span class="num">&yen;${p.price}</span>
						<span class="old">&yen;${p.oldPrice}</span>
					</div>
				</div>
			</a>
		`).join('');
	} else {
		document.getElementById('relatedSection').style.display = 'none';
	}

	// 数量控制
	function changeQty(delta) {
		buyQty = Math.max(1, Math.min(99, buyQty + delta));
		document.getElementById('buyQty').value = buyQty;
		document.getElementById('qtyMinus').disabled = buyQty <= 1;
	}

	function validateQty() {
		let v = parseInt(document.getElementById('buyQty').value) || 1;
		buyQty = Math.max(1, Math.min(99, v));
		document.getElementById('buyQty').value = buyQty;
	}

	// 加入购物车
	function addToCartDetail() {
		addToCart(currentProduct.id, buyQty);
		toast(`"${currentProduct.name}" ×${buyQty} 已加入购物车`);
	}

	// 立即购买
	function buyNow() {
		addToCart(currentProduct.id, buyQty);
		window.location.href = 'checkout.html';
	}

	// 购物车通用操作
	function addToCart(id, qty) {
		let cart = JSON.parse(localStorage.getItem('shopCart') || '[]');
		const exist = cart.find(c => c.id === id);
		if (exist) {
			exist.qty += qty;
		} else {
			const p = products.find(p => p.id === id);
			cart.push({ id: p.id, name: p.name, price: p.price, img: p.img, qty: qty });
		}
		localStorage.setItem('shopCart', JSON.stringify(cart));
		updateCartCount();
	}

	function updateCartCount() {
		const cart = JSON.parse(localStorage.getItem('shopCart') || '[]');
		document.getElementById('cartCount').textContent = cart.reduce((s, c) => s + c.qty, 0);
	}

	function toast(msg) {
		const t = document.getElementById('toast');
		t.textContent = msg;
		t.classList.add('show');
		clearTimeout(t._timer);
		t._timer = setTimeout(() => t.classList.remove('show'), 2500);
	}

	// 搜索
	function goSearch() {
		const kw = document.getElementById('searchInput').value.trim();
		if (kw) location.href = 'index.html?search=' + encodeURIComponent(kw);
	}
	document.getElementById('searchInput').addEventListener('keydown', function(e) {
		if (e.key === 'Enter') goSearch();
	});

	updateCartCount();
</script>
<script src="ai-assistant.js"></script>
